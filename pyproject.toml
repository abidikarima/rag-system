[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_system"
version = "0.1.0"
description = "A Python project for parsing and handling various file types."

authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

requires-python = ">=3.11,<3.13"

dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "requests>=2.32",
    "pydantic>=2.7",
    "docling"
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and python_version >= '3.11' and python_version < '3.13'"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
